<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Dark oatmeal hoodie, flat lay">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0e0e0f"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9bea9"/>
      <stop offset="0.55" stop-color="#b8ac96"/>
      <stop offset="1" stop-color="#9f937d"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hoodIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7362"/>
      <stop offset="1" stop-color="#5f574a"/>
    </linearGradient>
    <pattern id="rib" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ab9f89"/>
      <rect width="4" height="10" fill="#9d917b"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- drop shadow -->
  <path d="M410 330 L330 360 L190 760 L260 790 L370 560 L380 930 L820 930 L830 560 L940 790 L1010 760 L870 360 L790 330 Z" fill="#000" opacity="0.55" filter="url(#soft)" transform="translate(12 22)"/>
  <!-- sleeves -->
  <path d="M415 335 L335 362 Q300 380 288 420 L196 735 Q192 752 208 758 L262 780 Q276 785 282 770 L378 548 Z" fill="url(#fabric)"/>
  <path d="M785 335 L865 362 Q900 380 912 420 L1004 735 Q1008 752 992 758 L938 780 Q924 785 918 770 L822 548 Z" fill="url(#fabric)"/>
  <path d="M196 735 L262 780 L250 808 L184 762 Z" fill="url(#rib)"/>
  <path d="M1004 735 L938 780 L950 808 L1016 762 Z" fill="url(#rib)"/>
  <!-- body -->
  <path d="M415 335 Q600 300 785 335 L822 548 L828 880 L372 880 L378 548 Z" fill="url(#fabric)"/>
  <rect x="372" y="880" width="456" height="56" fill="url(#rib)"/>
  <path d="M372 880 L828 880" stroke="#8f846f" stroke-width="2"/>
  <path d="M415 335 Q600 300 785 335 L822 548 L828 880 L372 880 L378 548 Z" fill="url(#shade)"/>
  <!-- hood -->
  <path d="M470 330 Q470 210 600 200 Q730 210 730 330 Q700 420 600 430 Q500 420 470 330 Z" fill="url(#fabric)"/>
  <path d="M500 335 Q510 250 600 242 Q690 250 700 335 Q672 392 600 398 Q528 392 500 335 Z" fill="url(#hoodIn)"/>
  <path d="M470 330 Q500 420 600 430 Q700 420 730 330" fill="none" stroke="#9c907a" stroke-width="3"/>
  <!-- drawstrings -->
  <path d="M572 420 Q566 500 576 560" fill="none" stroke="#e9e3d6" stroke-width="7" stroke-linecap="round"/>
  <path d="M628 420 Q636 505 622 572" fill="none" stroke="#e9e3d6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="572" cy="420" r="7" fill="#7d7362"/>
  <circle cx="628" cy="420" r="7" fill="#7d7362"/>
  <!-- kangaroo pocket -->
  <path d="M470 690 L730 690 L775 860 L425 860 Z" fill="#000" opacity="0.07"/>
  <path d="M470 690 L730 690 M470 690 L425 860 M730 690 L775 860" fill="none" stroke="#968a74" stroke-width="3"/>
  <path d="M480 698 L720 698" stroke="#d6ccb9" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <!-- chest patch -->
  <rect x="560" y="520" width="80" height="22" rx="4" fill="#a99d87" opacity="0.9"/>
  <!-- folds -->
  <path d="M430 600 Q470 640 450 720" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>
  <path d="M770 610 Q735 660 752 760" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>
  <path d="M300 520 Q330 560 300 640" fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="12" stroke-linecap="round"/>
</svg>
