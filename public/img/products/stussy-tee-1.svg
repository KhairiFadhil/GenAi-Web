<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Black cotton tee, flat lay">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#0e0e0f"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3d"/>
      <stop offset="0.5" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#1f1f21"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <path d="M470 330 L300 400 L230 560 L360 610 L390 545 L392 900 L808 900 L810 545 L840 610 L970 560 L900 400 L730 330 Z" fill="#000" opacity="0.6" filter="url(#soft)" transform="translate(12 22)"/>
  <!-- tee -->
  <path d="M470 330 Q600 372 730 330 L900 400 L970 560 L840 610 L810 545 L808 900 L392 900 L390 545 L360 610 L230 560 L300 400 Z" fill="url(#fabric)"/>
  <path d="M470 330 Q600 372 730 330 L900 400 L970 560 L840 610 L810 545 L808 900 L392 900 L390 545 L360 610 L230 560 L300 400 Z" fill="url(#shade)"/>
  <!-- collar rib -->
  <path d="M470 330 Q600 372 730 330 Q712 398 600 404 Q488 398 470 330 Z" fill="#141415"/>
  <path d="M470 330 Q488 398 600 404 Q712 398 730 330" fill="none" stroke="#3d3d40" stroke-width="12"/>
  <rect x="582" y="352" width="36" height="22" rx="2" fill="#d9d6cf" opacity="0.85"/>
  <!-- hem and cuff stitching -->
  <path d="M396 884 L804 884" stroke="#4a4a4d" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M243 546 L362 592 M957 546 L838 592" stroke="#4a4a4d" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- folds -->
  <path d="M430 600 Q460 680 440 800" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="12" stroke-linecap="round"/>
  <path d="M770 590 Q740 690 760 820" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="12" stroke-linecap="round"/>
  <path d="M560 470 Q610 520 640 470" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="14" stroke-linecap="round"/>
</svg>
